[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vibecoding-core"
dynamic = ["version"]
description = "Host-owned native agent sessions for Remote Vibecoding."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.10,<4"]

[project.scripts]
vibecoding-core = "vibecoding_core.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.version]
path = "src/vibecoding_core/__init__.py"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/vibecoding_core/__init__.py" }]
