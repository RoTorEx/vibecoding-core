name: remote-vibecoding
services:
  core:
    image: remote-vibecoding-core:${CORE_REVISION:-local}
    build:
      context: ${REMOTE_VIBECODING_ROOT:?}/vibecoding-core
      args:
        APP_UID: ${APP_UID:?}
        APP_GID: ${APP_GID:?}
        APP_HOME: ${APP_HOME:?}
        REVISION: ${CORE_REVISION:-local}
    user: "${APP_UID}:${APP_GID}"
    init: true
    restart: unless-stopped
    environment:
      HOME: ${APP_HOME}
      VIBECODING_CORE_CONFIG: /srv/remote-vibecoding/config/core/core.toml
      VIBECODING_EXECUTOR_SSH_CONFIG: /srv/remote-vibecoding/config/core/executor-ssh.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${APP_HOME}
        target: ${APP_HOME}
        bind:
          create_host_path: false
      - type: bind
        source: /srv/remote-vibecoding/config/core
        target: /srv/remote-vibecoding/config/core
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/remote-vibecoding/data/core
        target: /srv/remote-vibecoding/data/core
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /host
        read_only: true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/vibecoding-core", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: journald
      options: {tag: remote-vibecoding-core}
    stop_grace_period: 45s
  bot:
    image: remote-vibecoding-bot:${BOT_REVISION:-local}
    build:
      context: ${REMOTE_VIBECODING_ROOT:?}/telegram-vibecoding
      args:
        APP_UID: ${APP_UID:?}
        APP_GID: ${APP_GID:?}
        APP_HOME: ${APP_HOME:?}
        REVISION: ${BOT_REVISION:-local}
    user: "${APP_UID}:${APP_GID}"
    init: true
    restart: unless-stopped
    environment:
      HOME: ${APP_HOME}
      TELEGRAM_VIBECODING_CONFIG: /srv/remote-vibecoding/config/notifier/bot.toml
    depends_on:
      core:
        condition: service_healthy
    volumes:
      - type: bind
        source: /srv/remote-vibecoding/data/notifier
        target: /srv/remote-vibecoding/data/notifier
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_STATE_DIR:?}/run
        target: ${APP_STATE_DIR}/run
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/remote-vibecoding/config/notifier/bot.toml
        target: /srv/remote-vibecoding/config/notifier/bot.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/remote-vibecoding/config/notifier/notifier-token
        target: /srv/remote-vibecoding/config/notifier/notifier-token
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/app/.venv/bin/telegram-vibecoding", "--health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: journald
      options: {tag: telegram-vibecoding}
    stop_grace_period: 45s
